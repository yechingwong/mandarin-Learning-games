<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>華語學習遊戲</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:#24364b;
    background:
      radial-gradient(circle at 12% 12%, rgba(128,190,255,.20), transparent 24%),
      radial-gradient(circle at 88% 10%, rgba(184,157,255,.16), transparent 24%),
      linear-gradient(180deg,#eef8ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:28px;
  }
  .wrap{
    width:min(980px,100%);
    background:rgba(255,255,255,.95);
    border:1px solid #dce8f2;
    border-radius:30px;
    box-shadow:0 18px 45px rgba(48,77,118,.12);
    padding:38px 30px 42px;
  }
  h1{
    text-align:center;
    font-size:38px;
    margin:0 0 10px;
  }
  .sub{
    text-align:center;
    color:#74869a;
    font-weight:700;
    margin-bottom:32px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px;
  }
  .card{
    text-decoration:none;
    color:inherit;
    border:2px solid #e4edf5;
    border-radius:26px;
    background:#fff;
    padding:30px 24px;
    min-height:270px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 12px 25px rgba(48,76,112,.07);
    transition:.18s ease;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 32px rgba(48,76,112,.12);
    border-color:#cbdff0;
  }
  .icon{
    font-size:92px;
    line-height:1;
    margin-bottom:18px;
  }
  .title{
    font-size:30px;
    font-weight:900;
    margin-bottom:10px;
  }
  .desc{
    color:#71849a;
    font-weight:700;
    line-height:1.55;
  }
  .play{
    margin-top:18px;
    padding:10px 18px;
    border-radius:999px;
    background:#f2f7ff;
    color:#5577a7;
    font-weight:900;
  }
  @media(max-width:720px){
    .grid{grid-template-columns:1fr}
    h1{font-size:32px}
    .wrap{padding:28px 18px 32px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1>華語學習遊戲</h1>
    <div class="sub">選一個遊戲開始練習</div>

    <div class="grid">
      <a class="card" href="./balloon/">
        <div class="icon">🎈</div>
        <div class="title">漢字氣球</div>
        <div class="desc">看圖，戳破正確的漢字氣球。</div>
        <div class="play">開始遊戲</div>
      </a>

      <a class="card" href="./train/">
        <div class="icon">🚂</div>
        <div class="title">送字上車</div>
        <div class="desc">看圖片和英文意思，把正確的詞語送上小火車。</div>
        <div class="play">開始遊戲</div>
      </a>
    </div>
  </main>
</body>
</html>
