<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>送字上車｜新版</title>
<style>
  :root{
    --bg1:#eef8ff;
    --bg2:#ffffff;
    --line:#dbe8f2;
    --text:#24364b;
    --muted:#72859b;
    --good:#239b68;
    --bad:#d96565;
    --shadow:0 18px 42px rgba(48,77,118,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 12% 12%, rgba(131,192,255,.20), transparent 24%),
      radial-gradient(circle at 86% 12%, rgba(185,155,255,.16), transparent 24%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
  }
  .app{
    width:min(1120px, calc(100% - 28px));
    margin:18px auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .topbar{
    padding:18px 22px;
    border-bottom:1px solid #e7eff6;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{
    width:50px;height:50px;border-radius:16px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#79baff,#7a65e7);
    font-size:28px;
  }
  .brand h1{margin:0;font-size:28px}
  .status{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .pill{
    padding:9px 14px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-weight:900;
  }
  .progress{
    width:175px;height:10px;border-radius:999px;background:#eaf1f7;overflow:hidden;
  }
  .progress > div{
    height:100%;width:0;background:linear-gradient(90deg,#77b9ff,#8167e8);
    transition:width .45s ease;
  }
  .game{
    min-height:780px;
    padding:20px 22px 26px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,#ffffff 0 74%, #f5f9fd 74%);
  }

  /* prompt */
  .prompt-card{
    width:min(760px, 96%);
    margin:0 auto 20px;
    background:#fff;
    border:2px solid #e5edf5;
    border-radius:28px;
    box-shadow:0 12px 25px rgba(48,76,112,.07);
    padding:18px;
  }
  .prompt-inner{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:16px;
    align-items:center;
  }
  .prompt-image{
    min-height:150px;
    border-radius:22px;
    background:#f6fbff;
    border:1px solid #e7eef6;
    display:grid;
    place-items:center;
    overflow:hidden;
    padding:10px;
  }

  .prompt-image img.ref-image{
    max-width:100%;
    max-height:126px;
    object-fit:contain;
    border-radius:12px;
    display:block;
  }

  .prompt-text{
    min-height:150px;
    border-radius:22px;
    background:#fbfdff;
    border:1px solid #e7eef6;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
  }
  .prompt-meaning{
    font-size:30px;
    font-weight:900;
    line-height:1.25;
  }

  /* image scenes */
  .scene-box{width:100%;height:130px;display:grid;place-items:center}
  .emoji-scene{font-size:72px;line-height:1;text-align:center}
  .double-emoji{display:flex;align-items:center;justify-content:center;gap:10px;font-size:64px}
  .id-card{
    width:118px;height:82px;border-radius:16px;background:#d8edff;
    border:3px solid #fff;box-shadow:0 8px 16px rgba(51,83,120,.12);
    position:relative;padding:10px 10px 10px 44px;
  }
  .id-card .avatar{
    position:absolute;left:10px;top:16px;width:24px;height:24px;border-radius:50%;
    background:#ffcb99;
    box-shadow:0 18px 0 2px #8ab7db;
  }
  .id-card .line{height:8px;border-radius:999px;background:#90b6d8;margin-bottom:8px}
  .id-card .line.short{width:60%}
  .business-man{
    width:86px;height:110px;position:relative;
  }
  .business-man .head{
    width:46px;height:46px;border-radius:50%;background:#ffd1a8;
    position:absolute;left:20px;top:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.05);
  }
  .business-man .hair{
    width:50px;height:22px;border-radius:30px 30px 10px 10px;background:#3b4656;
    position:absolute;left:18px;top:0;
  }
  .business-man .body{
    width:72px;height:58px;border-radius:20px 20px 14px 14px;background:#6f8ed6;
    position:absolute;left:7px;top:44px;
  }
  .business-man .shirt{
    width:28px;height:30px;background:#fff;border-radius:0 0 14px 14px;
    position:absolute;left:29px;top:48px;
  }
  .business-man .tie{
    width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
    border-top:22px solid #d85d5d;position:absolute;left:35px;top:58px;
  }
  .flag-card{
    width:140px;height:92px;border-radius:18px;background:#fff;border:3px solid #fff;
    box-shadow:0 8px 16px rgba(51,83,120,.12);display:flex;align-items:center;justify-content:center;
    font-size:66px;
  }
  .mini-caption{
    margin-top:8px;font-size:13px;color:#7c8fa3;font-weight:800;text-align:center;
  }
  .tower-group{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }

  .taipei101{
    width:88px;
    height:128px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
  }
  .taipei101 .spire{
    width:5px;height:22px;background:#557b8d;border-radius:4px 4px 0 0;
  }
  .taipei101 .needle{
    width:11px;height:12px;background:#668f9d;border-radius:3px 3px 0 0;
  }
  .taipei101 .stack{
    width:50px;
    height:82px;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    gap:1px;
  }
  .taipei101 .tier{
    height:10px;
    background:linear-gradient(90deg,#5f8e91,#8fc0b8,#5c888c);
    border:1px solid #4f777a;
    clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.22);
  }
  .taipei101 .tier:nth-child(1){width:58px}
  .taipei101 .tier:nth-child(2){width:56px}
  .taipei101 .tier:nth-child(3){width:54px}
  .taipei101 .tier:nth-child(4){width:52px}
  .taipei101 .tier:nth-child(5){width:50px}
  .taipei101 .tier:nth-child(6){width:48px}
  .taipei101 .tier:nth-child(7){width:46px}
  .taipei101 .tier:nth-child(8){width:44px}
  .taipei101 .base{
    width:66px;height:18px;background:#678d92;border:1px solid #53777a;
    border-radius:3px 3px 6px 6px;
  }

  /* journey */
  .journey{
    width:min(1000px,100%);
    margin:0 auto 20px;
    position:relative;
    min-height:270px;
  }
  .track-wrapper{
    position:relative;
    width:100%;
    height:270px;
  }
  .track{
    position:absolute;
    left:34px;right:34px;bottom:56px;height:8px;background:#7f8d9a;border-radius:999px;
  }
  .track:before{
    content:"";position:absolute;left:0;right:0;top:-12px;height:8px;
    background:repeating-linear-gradient(90deg,#acb6c1 0 26px, transparent 26px 44px);
  }
  .train{
    position:absolute;
    bottom:72px;left:0;width:100%;height:140px;pointer-events:none;
  }
  .engine,.car{
    position:absolute;border:4px solid #fff;box-shadow:0 12px 22px rgba(45,70,105,.12);
  }
  .engine{
    width:158px;height:100px;border-radius:24px;background:#79baff;
  }
  .engine:after{
    content:"🚂";position:absolute;inset:0;display:grid;place-items:center;font-size:58px;
  }
  .car{
    width:235px;height:100px;border-radius:22px;background:#fff0a7;display:grid;place-items:center;
  }
  .dropzone{
    width:175px;height:64px;border-radius:16px;border:3px dashed #c8a84b;
    display:grid;place-items:center;background:#fffbe7;color:#947a35;
    font-weight:900;text-align:center;padding:0 8px;
  }
  .dropzone.filled{
    border-style:solid;background:#fff;color:#24364b;font-size:34px;
  }
  .wheel{
    position:absolute;width:34px;height:34px;border-radius:50%;
    background:#445569;border:5px solid #dce4ec;bottom:-19px;
  }
  .w1{left:26px}.w2{right:26px}

  .stations{
    position:absolute;
    left:34px;right:34px;bottom:8px;
    display:flex;justify-content:space-between;align-items:flex-end;
    z-index:2;pointer-events:none;
  }
  .station{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    color:#7a8da3;font-size:12px;font-weight:800;
  }
  .station-dot{
    width:18px;height:18px;border-radius:50%;background:#d6e2ee;border:4px solid #fff;
    box-shadow:0 3px 8px rgba(40,60,90,.08);
  }
  .station.done .station-dot{background:#89d6ac}
  .station.end .station-dot{background:#ffd36e}
  .station-label{white-space:nowrap}

  .word-bank{
    width:min(940px,100%);
    margin:0 auto 18px;
    display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  }
  .word{
    min-width:155px;padding:16px 22px;border-radius:18px;background:#fff;
    border:2px solid #dce7f1;box-shadow:0 9px 18px rgba(53,80,118,.08);
    font-size:30px;font-weight:900;text-align:center;cursor:grab;user-select:none;transition:.16s;
  }
  .word:hover{transform:translateY(-3px)}
  .word:active{cursor:grabbing}
  .word.correct{opacity:.35;pointer-events:none}
  .word.wrong{animation:shake .35s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-9px)}
    75%{transform:translateX(9px)}
  }

  .feedback{
    width:min(620px,94%);min-height:58px;margin:0 auto;
    border:1px solid #e4edf5;border-radius:18px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-weight:900;color:#60758b;box-shadow:0 10px 22px rgba(50,78,116,.07);
    padding:12px 16px;background:#fff;
  }

  .feedback:empty{
    min-height:0;
    height:0;
    padding:0;
    border:0;
    box-shadow:none;
    margin-top:0;
    background:transparent;
  }

  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}
  .pinyin{margin-left:8px;color:#4e74a2}
  .meaning{margin-left:8px;color:#74869a;font-size:14px}

  /* finish */
  .finish{
    position:absolute;inset:0;background:rgba(255,255,255,.96);
    display:none;place-items:center;z-index:20;padding:24px;overflow:hidden;
  }
  .finish.show{display:grid}
  .finish-card{
    width:min(580px,94%);text-align:center;border:1px solid #e3edf5;border-radius:28px;
    background:#fff;padding:32px 28px;box-shadow:0 18px 40px rgba(46,77,121,.11);position:relative;z-index:2;
  }
  .finish-card .icon{font-size:88px}
  .finish-card h2{font-size:34px;margin:8px 0}
  .finish-card p{color:#74869a;line-height:1.7;font-weight:700}
  .station-sign{
    display:inline-flex;align-items:center;gap:8px;
    margin:10px 0 12px;padding:10px 16px;border-radius:999px;
    background:#fff7d3;border:1px solid #f1e0a0;color:#8b6d1d;font-weight:900;
  }

  .badge-wrap{
    margin:18px auto 10px;
    display:flex;
    justify-content:center;
  }
  .completion-badge{
    width:170px;
    height:170px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff8cf, #ffd96d 60%, #f2b93a 100%);
    border:8px solid #fff7df;
    box-shadow:0 14px 28px rgba(229,177,49,.28);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#8a6412;
    font-weight:900;
    text-align:center;
    line-height:1.2;
  }
  .completion-badge:before,
  .completion-badge:after{
    content:"";
    position:absolute;
    bottom:-30px;
    width:34px;
    height:54px;
    background:linear-gradient(180deg,#7bb7ff,#5d8ff0);
    clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);
    z-index:-1;
  }
  .completion-badge:before{left:34px; transform:rotate(-8deg);}
  .completion-badge:after{right:34px; transform:rotate(8deg);}
  .badge-icon{
    font-size:42px;
    margin-bottom:6px;
  }
  .badge-title{
    font-size:24px;
    letter-spacing:.04em;
  }
  .badge-sub{
    font-size:16px;
    margin-top:4px;
  }

  .btn{
    border:0;cursor:pointer;border-radius:16px;padding:14px 22px;font:inherit;font-weight:900;
    background:linear-gradient(135deg,#5f8ef5,#7a63e6);color:#fff;box-shadow:0 10px 24px rgba(88,103,201,.22);
    margin-top:12px;
  }


  .score-only-card{
    width:min(420px,90%);
    min-height:260px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
  }
  .final-score{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:140px;
    padding:16px 28px;
    border-radius:999px;
    background:#fff4cf;
    border:1px solid #efd477;
    color:#8a6516;
    font-size:34px;
    font-weight:900;
    letter-spacing:.02em;
  }

  /* confetti */
  .confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti{
    position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;
    opacity:.95;animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(920px) rotate(520deg);opacity:1}
  }

  @media (max-width:860px){
    .topbar{flex-direction:column;align-items:flex-start}
    .status{justify-content:flex-start}
    .progress{width:120px}
    .game{min-height:900px;padding:18px 12px 22px}
    .prompt-inner{grid-template-columns:1fr}
    .prompt-image{min-height:120px}
    .prompt-text{min-height:auto}
    .prompt-meaning{font-size:26px}
    .word{min-width:122px;font-size:26px}
  }
</style>

<style id="home-link-style">
  .home-link{
    position:fixed;
    top:14px;
    left:14px;
    z-index:9999;
    text-decoration:none;
    color:#4e6685;
    background:rgba(255,255,255,.95);
    border:1px solid #d9e6f1;
    border-radius:999px;
    padding:9px 14px;
    font-weight:900;
    box-shadow:0 8px 18px rgba(47,76,112,.10);
  }
  .home-link:hover{transform:translateY(-1px)}
</style>

</head>
<body>
<a class="home-link" href="../" aria-label="回到遊戲首頁">← 遊戲首頁</a>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">🚂</div>
      <h1>送字上車</h1>
    </div>
    <div class="status">
      <div class="pill" id="roundText">第 1 / 5 題</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="pill">⭐ <span id="score">0</span></div>
    </div>
  </header>

  <main class="game">
    <div class="prompt-card">
      <div class="prompt-inner">
        <div class="prompt-image" id="promptImage"></div>
        <div class="prompt-text">
          <div class="prompt-meaning" id="promptMeaning"></div>
        </div>
      </div>
    </div>

    <div class="journey">
      <div class="track-wrapper">
        <div class="train" id="train">
          <div class="engine" id="engine">
            <div class="wheel w1"></div><div class="wheel w2"></div>
          </div>
          <div class="car" id="car">
            <div class="dropzone" id="dropzone">放這裡</div>
            <div class="wheel w1"></div><div class="wheel w2"></div>
          </div>
        </div>

        <div class="track"></div>

        <div class="stations" id="stations">
          <div class="station"><div class="station-dot"></div><div class="station-label">出發</div></div>
          <div class="station"><div class="station-dot"></div><div class="station-label">1</div></div>
          <div class="station"><div class="station-dot"></div><div class="station-label">2</div></div>
          <div class="station"><div class="station-dot"></div><div class="station-label">3</div></div>
          <div class="station"><div class="station-dot"></div><div class="station-label">4</div></div>
          <div class="station end"><div class="station-dot"></div><div class="station-label">終點站</div></div>
        </div>
      </div>
    </div>

    <div class="word-bank" id="wordBank"></div>
    <div class="feedback" id="feedback"></div>

    <div class="finish" id="finish">
      <div class="finish-card score-only-card">
        <div class="final-score" id="finalScore">0/5題</div>
        <button class="btn" id="restartBtn">再試一次</button>
      </div>
    </div>
  </main>
</div>

<script>
const questions = [
  {
    answer:"貴姓",
    pinyin:"guìxìng",
    meaning:"May I ask your surname?",

let index = 0;
let score = 0;
let correctCount = 0;
let locked = false;
let currentStep = 0;
let audioContext = null;
const $ = s => document.querySelector(s);

function shuffle(arr){ return [...arr].sort(() => Math.random() - 0.5); }

function speakWord(text){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-TW";
  utter.rate = 0.76;
  utter.pitch = 1.02;
  window.speechSynthesis.speak(utter);
}

function wrongSound(){
  try{
    if(!audioContext){ audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  }catch(e){}
}


function correctSound(){
  try{
    if(!audioContext){ audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
    const now = audioContext.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, idx) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now + idx * 0.12);
      gain.gain.setValueAtTime(0.001, now + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.18);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(now + idx * 0.12);
      osc.stop(now + idx * 0.12 + 0.2);
    });
  }catch(e){}
}

function arrivalSound(){
  try{
    if(!audioContext){ audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
    const now = audioContext.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, idx) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now + idx * 0.16);
      gain.gain.setValueAtTime(0.001, now + idx * 0.16);
      gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.16 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.24);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(now + idx * 0.16);
      osc.stop(now + idx * 0.16 + 0.24);
    });
  }catch(e){}
}

function getTrainLeft(step){
  const mobile = window.innerWidth <= 860;
  const positions = mobile
    ? [0, 60, 120, 180, 240, 300]
    : [0, 130, 260, 390, 520, 650];
  return positions[Math.max(0, Math.min(step, positions.length - 1))];
}

function updateTrainPosition(step){
  const engineLeft = getTrainLeft(step);
  $("#engine").style.left = engineLeft + "px";
  $("#car").style.left = (engineLeft + 164) + "px";
}

function updateStations(){
  const stationEls = [...document.querySelectorAll(".station")];
  stationEls.forEach((el, i) => {
    el.classList.toggle("done", i <= currentStep);
  });
}

function renderQuestion(){
  locked = false;
  const q = questions[index];
  $("#roundText").textContent = `第 ${index + 1} / ${questions.length} 題`;
  $("#progressBar").style.width = `${(index / questions.length) * 100}%`;
  $("#score").textContent = score;
  $("#promptImage").innerHTML = q.imageHTML;
  $("#promptMeaning").textContent = q.meaning;
  $("#dropzone").className = "dropzone";
  $("#dropzone").textContent = "放這裡";
  $("#feedback").className = "feedback";
  $("#feedback").textContent = "";

  const bank = $("#wordBank");
  bank.innerHTML = "";
  shuffle(q.options).forEach(word => {
    const el = document.createElement("div");
    el.className = "word";
    el.textContent = word;
    el.draggable = true;
    el.dataset.word = word;
    el.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", word);
      e.dataTransfer.effectAllowed = "move";
    });
    el.addEventListener("click", () => checkAnswer(word, el));
    bank.appendChild(el);
  });

  updateTrainPosition(currentStep);
  updateStations();
}

const dropzone = $("#dropzone");
dropzone.addEventListener("dragover", e => e.preventDefault());
dropzone.addEventListener("drop", e => {
  e.preventDefault();
  const word = e.dataTransfer.getData("text/plain");
  const el = [...document.querySelectorAll(".word")].find(x => x.dataset.word === word);
  checkAnswer(word, el);
});

function checkAnswer(word, el){
  if(locked) return;
  const q = questions[index];
  locked = true;

  if(word === q.answer){
    score += 20;
    correctCount += 1;
    $("#score").textContent = score;
    el?.classList.add("correct");
    $("#dropzone").className = "dropzone filled";
    $("#dropzone").textContent = q.answer;
    $("#feedback").className = "feedback good";
    $("#feedback").innerHTML = `答對了！${q.answer}<span class="pinyin">${q.pinyin}</span>`;
    correctSound();
    setTimeout(() => speakWord(q.answer), 320);

    currentStep = Math.min(currentStep + 1, 5);
    setTimeout(() => {
      updateTrainPosition(currentStep);
      updateStations();
    }, 120);

    setTimeout(nextQuestion, 1500);
  }else{
    if(el){
      el.classList.remove("wrong");
      void el.offsetWidth;
      el.classList.add("wrong");
    }
    $("#feedback").className = "feedback bad";
    $("#feedback").innerHTML = `答案是 <b>${q.answer}</b>`;
    wrongSound();

    // 答錯時不前進；先播放答錯聲，再念正確答案。
    setTimeout(() => speakWord(q.answer), 380);
    setTimeout(nextQuestion, 1650);
  }
}

function makeConfetti(){
  const layer = $("#confettiLayer");
  layer.innerHTML = "";
  const colors = ["#ffd86b","#7dc6ff","#ff9db1","#9ce3c0","#c7b2ff"];
  for(let i=0;i<42;i++){
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random()*100 + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = (2.7 + Math.random()*1.8) + "s";
    piece.style.animationDelay = (Math.random()*0.6) + "s";
    piece.style.transform = `translateY(0) rotate(${Math.random()*80}deg)`;
    layer.appendChild(piece);
  }
}

function nextQuestion(){
  index++;
  if(index >= questions.length){
    $("#progressBar").style.width = "100%";
    $("#finalScore").textContent = `${correctCount}/5題`;
    $("#finish").classList.add("show");
  }else{
    renderQuestion();
  }
}

$("#restartBtn").addEventListener("click", () => {
  index = 0;
  score = 0;
  correctCount = 0;
  currentStep = 0;
  $("#finish").classList.remove("show");
  renderQuestion();
});

window.addEventListener("resize", () => updateTrainPosition(currentStep));

renderQuestion();
</script>
</body>
</html>
