<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>漢字氣球｜有聲版原型</title>
<style>
  :root{
    --bg1:#eef7ff;
    --bg2:#f9fbff;
    --panel:#ffffff;
    --line:#d9e7f3;
    --text:#24364b;
    --muted:#73859b;
    --good:#23a36e;
    --bad:#dd6a6a;
    --shadow:0 18px 40px rgba(45,78,121,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 15%, rgba(113,185,255,.17), transparent 24%),
      radial-gradient(circle at 85% 10%, rgba(175,145,255,.14), transparent 24%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
  }
  .app{
    width:min(1100px, calc(100% - 32px));
    margin:18px auto;
    background:rgba(255,255,255,.92);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .topbar{
    padding:18px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    border-bottom:1px solid #e7eff7;
  }
  .titlebox{display:flex;align-items:center;gap:12px}
  .badge{
    width:48px;height:48px;border-radius:16px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#7cb8ff,#8f79f0);
    color:#fff;font-size:28px;font-weight:900;
  }
  .titlebox h1{margin:0;font-size:26px}
  .titlebox p{margin:2px 0 0;color:var(--muted);font-weight:700}
  .status{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;
  }
  .pill{
    background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:9px 14px;font-weight:900;
  }
  .progress{
    width:180px;height:10px;border-radius:999px;background:#eaf1f8;overflow:hidden;
  }
  .progress > div{
    width:0;height:100%;
    background:linear-gradient(90deg,#73b7ff,#7e69e8);
    transition:width .35s ease;
  }

  .stage{
    min-height:710px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,#ffffff 0 78%, #f2f8fe 78% 100%);
  }
  .cloud{position:absolute;opacity:.23;filter:grayscale(1)}
  .cloud.c1{left:4%;top:9%;font-size:72px}
  .cloud.c2{right:7%;top:16%;font-size:58px}
  .cloud.c3{left:42%;top:8%;font-size:50px}

  .hint{
    position:absolute;
    top:24px;left:0;right:0;
    text-align:center;
    font-size:20px;font-weight:900;color:#5f7288;
    z-index:5;
  }

  .cue-area{
    position:absolute;
    top:78px;left:50%;transform:translateX(-50%);
    width:min(370px, 86%);
    background:#fff;
    border:2px solid #e2ebf4;
    border-radius:28px;
    padding:24px 18px 18px;
    text-align:center;
    box-shadow:0 14px 28px rgba(60,90,130,.08);
    z-index:4;
  }
  .cue-scene{
    min-height:150px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    animation:fadeIn .3s ease;
  }
  .emoji-big{font-size:82px;line-height:1}
  .emoji-mid{font-size:58px;line-height:1}
  .scene-label{
    margin-top:10px;
    font-size:15px;
    color:var(--muted);
    font-weight:800;
  }

  #balloonField{
    position:absolute;
    inset:285px 18px 70px;
  }
  .balloon-wrap{
    position:absolute;
    width:170px;
    height:220px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:float 3.2s ease-in-out infinite;
    user-select:none;
  }
  .balloon-wrap button{
    background:none;border:0;padding:0;cursor:pointer;
  }
  .balloon{
    width:132px;height:160px;
    border-radius:54% 54% 48% 48%;
    display:grid;place-items:center;
    font-size:52px;font-weight:900;color:#22344d;
    border:4px solid rgba(255,255,255,.72);
    box-shadow:inset -10px -12px 20px rgba(0,0,0,.06), 0 14px 24px rgba(43,66,100,.14);
    transition:transform .16s, opacity .25s;
    position:relative;
  }
  .balloon:after{
    content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;
    border-top:15px solid rgba(104,118,139,.28);
  }
  .string{width:2px;height:46px;background:#b6c2cf;margin-top:8px}
  .balloon-wrap:hover .balloon{transform:scale(1.06)}
  .b1 .balloon{background:#ffd86b}
  .b2 .balloon{background:#8fd8ff}
  .b3 .balloon{background:#c3b0ff}
  .b4 .balloon{background:#ffb2c5}
  .b5 .balloon{background:#9ce3c0}
  .wrong .balloon{animation:shake .35s ease}
  .correct .balloon{animation:pop .5s ease forwards}
  .disabled{pointer-events:none;opacity:.62}

  .feedback{
    position:absolute;
    left:50%;bottom:18px;transform:translateX(-50%);
    min-width:min(480px, 92%);
    max-width:90%;
    padding:15px 20px;
    border-radius:18px;
    background:rgba(255,255,255,.96);
    border:1px solid #e3edf6;
    color:#607389;
    font-weight:900;
    text-align:center;
    z-index:6;
    box-shadow:0 10px 24px rgba(50,78,115,.08);
  }
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}

  .burst{
    position:absolute;inset:0;pointer-events:none;z-index:9;
  }
  .star{
    position:absolute;
    font-size:28px;
    animation:star .8s ease forwards;
  }

  .finish{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(255,255,255,.95);z-index:15;padding:24px;
  }
  .finish.show{display:grid}
  .finish-card{
    width:min(520px, 94%);
    text-align:center;
    background:#fff;
    border:1px solid #e4edf6;
    border-radius:28px;
    padding:30px 22px;
    box-shadow:0 18px 40px rgba(46,77,121,.11);
  }
  .finish-card .icon{font-size:92px}
  .finish-card h2{font-size:34px;margin:10px 0 8px}
  .finish-card p{color:var(--muted);line-height:1.7;font-weight:700}
  .btn{
    margin-top:14px;
    border:0;cursor:pointer;
    border-radius:16px;padding:14px 22px;
    font:inherit;font-weight:900;
    background:linear-gradient(135deg,#5f8ef5,#7a63e6);
    color:#fff;box-shadow:0 10px 24px rgba(88,103,201,.22);
  }

  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-16px) rotate(1deg)}
  }
  @keyframes pop{
    0%{transform:scale(1);opacity:1}
    45%{transform:scale(1.24);opacity:1}
    100%{transform:scale(.12);opacity:0}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-10px)}
    75%{transform:translateX(10px)}
  }
  @keyframes star{
    0%{transform:translate(0,0) scale(.2);opacity:0}
    35%{opacity:1}
    100%{transform:translate(var(--x),var(--y)) scale(1.2);opacity:0}
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:none}
  }
  @media (max-width:860px){
    .topbar{flex-direction:column;align-items:flex-start}
    .status{justify-content:flex-start}
    .progress{width:130px}
    .stage{min-height:800px}
    .cue-area{top:88px}
    #balloonField{inset:330px 8px 80px}
    .balloon-wrap{width:128px;height:190px}
    .balloon{width:100px;height:128px;font-size:42px}
  }
</style>

<style id="home-link-style">
  .home-link{
    position:fixed;
    top:14px;
    left:14px;
    z-index:9999;
    text-decoration:none;
    color:#4e6685;
    background:rgba(255,255,255,.95);
    border:1px solid #d9e6f1;
    border-radius:999px;
    padding:9px 14px;
    font-weight:900;
    box-shadow:0 8px 18px rgba(47,76,112,.10);
  }
  .home-link:hover{transform:translateY(-1px)}
</style>

</head>
<body>
<a class="home-link" href="../" aria-label="回到遊戲首頁">← 遊戲首頁</a>
<div class="app">
  <div class="topbar">
    <div class="titlebox">
      <div class="badge">字</div>
      <div>
        <h1>漢字氣球</h1>
        <p>看圖案，戳破正確的氣球</p>
      </div>
    </div>
    <div class="status">
      <div class="pill" id="roundText">第 1 / 5 題</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="pill">⭐ <span id="score">0</span></div>
    </div>
  </div>

  <div class="stage">
    <div class="cloud c1">☁</div>
    <div class="cloud c2">☁</div>
    <div class="cloud c3">☁</div>

    <div class="hint">請戳破正確的氣球</div>

    <div class="cue-area">
      <div class="cue-scene" id="cueScene"></div>
      <div class="scene-label" id="sceneLabel"></div>
    </div>

    <div id="balloonField"></div>
    <div class="burst" id="burst"></div>

    <div class="feedback" id="feedback">先看上方圖案，再選一顆氣球。答對會播放正確發音。</div>

    <div class="finish" id="finish">
      <div class="finish-card">
        <div class="icon">🎈🏆</div>
        <h2>完成了！</h2>
        <p id="summary"></p>
        <button class="btn" id="restartBtn">再玩一次</button>
      </div>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    answer: "您",
    speech: "您",
    caption: "對老師或長輩有禮貌地打招呼",
    scene: ['<span class="emoji-mid">🙇‍♀️</span>','<span class="emoji-mid">👩‍🏫</span>'],
    options: ["您","我","他"]
  },
  {
    answer: "我",
    speech: "我",
    caption: "指自己",
    scene: ['<span class="emoji-big">🙋‍♀️</span>'],
    options: ["我","好","不"]
  },
  {
    answer: "好",
    speech: "好",
    caption: "很好、可以",
    scene: ['<span class="emoji-mid">😊</span>','<span class="emoji-mid">👍</span>'],
    options: ["好","您","不"]
  },
  {
    answer: "不",
    speech: "不",
    caption: "不要、不是",
    scene: ['<span class="emoji-big">🙅‍♀️</span>'],
    options: ["不","我","好"]
  },
  {
    answer: "他",
    speech: "他",
    caption: "男生、他",
    scene: ['<span class="emoji-big">👦</span>'],
    options: ["他","您","我"]
  }
];

const positionsDesktop = [
  {l:8,t:8},{l:39,t:2},{l:70,t:10}
];
const positionsMobile = [
  {l:6,t:8},{l:37,t:2},{l:68,t:9}
];

let index = 0;
let score = 0;
let locked = false;
let audioContext = null;

const $ = s => document.querySelector(s);

function getAudioContext(){
  if(!audioContext){
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioContext;
}

function playWrongSound(){
  try{
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  }catch(e){
    console.log("wrong sound error", e);
  }
}

function speakWord(text){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-TW";
  utter.rate = 0.78;
  utter.pitch = 1.03;
  window.speechSynthesis.speak(utter);
}

function renderQuestion(){
  locked = false;
  const q = questions[index];
  $("#roundText").textContent = `第 ${index + 1} / ${questions.length} 題`;
  $("#progressBar").style.width = `${(index / questions.length) * 100}%`;
  $("#score").textContent = score;
  $("#cueScene").innerHTML = q.scene.join('');
  $("#sceneLabel").textContent = q.caption;
  $("#feedback").className = "feedback";
  $("#feedback").textContent = "先看上方圖案，再選一顆氣球。";

  const field = $("#balloonField");
  field.innerHTML = "";
  const positions = window.innerWidth <= 860 ? positionsMobile : positionsDesktop;
  const opts = [...q.options].sort(() => Math.random() - 0.5);

  opts.forEach((char, i) => {
    const wrap = document.createElement("div");
    wrap.className = `balloon-wrap b${(i % 5) + 1}`;
    wrap.style.left = positions[i].l + "%";
    wrap.style.top = positions[i].t + "%";
    wrap.style.animationDelay = `${i * 0.18}s`;
    wrap.dataset.char = char;
    wrap.innerHTML = `
      <button aria-label="${char}">
        <div class="balloon">${char}</div>
        <div class="string"></div>
      </button>
    `;
    wrap.querySelector("button").addEventListener("click", () => choose(wrap, char));
    field.appendChild(wrap);
  });
}

function choose(el, char){
  if(locked) return;
  const q = questions[index];

  if(char === q.answer){
    locked = true;
    score += 20;
    $("#score").textContent = score;
    el.classList.add("correct");
    $("#feedback").className = "feedback good";
    $("#feedback").textContent = `答對了！這是「${q.answer}」。`;
    burst(el);
    speakWord(q.speech);
    setTimeout(nextQuestion, 1100);
  }else{
    el.classList.remove("wrong");
    void el.offsetWidth;
    el.classList.add("wrong");
    $("#feedback").className = "feedback bad";
    $("#feedback").textContent = "答錯了，再試一次。";
    playWrongSound();
  }
}

function burst(el){
  const layer = $("#burst");
  const base = el.getBoundingClientRect();
  const area = layer.getBoundingClientRect();
  const cx = base.left - area.left + base.width / 2;
  const cy = base.top - area.top + base.height / 2;
  const icons = ["⭐","✨","🌟","⭐","✨"];

  for(let i=0; i<10; i++){
    const s = document.createElement("div");
    s.className = "star";
    s.textContent = icons[i % icons.length];
    s.style.left = cx + "px";
    s.style.top = cy + "px";
    const a = Math.random() * Math.PI * 2;
    const d = 70 + Math.random() * 90;
    s.style.setProperty("--x", Math.cos(a) * d + "px");
    s.style.setProperty("--y", Math.sin(a) * d + "px");
    layer.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }
}

function nextQuestion(){
  index++;
  if(index >= questions.length){
    $("#progressBar").style.width = "100%";
    $("#summary").innerHTML = `你答對了 <b>${score / 20}</b> 題，共 <b>${score}</b> 分。<br>本版共 5 題：您、我、好、不、他。`;
    $("#finish").classList.add("show");
  }else{
    renderQuestion();
  }
}
$("#restartBtn").addEventListener("click", () => {
  index = 0;
  score = 0;
  $("#finish").classList.remove("show");
  renderQuestion();
});

window.addEventListener("resize", renderQuestion);
renderQuestion();
</script>
</body>
</html>
